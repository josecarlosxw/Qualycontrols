<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamentos de Retrabalho - QualiControl</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#1e4fe0', 600: '#2c63f5', 800: '#12328f', 900: '#0b0b0f' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script>
        if (localStorage.getItem('qc-theme') !== 'light') { document.documentElement.classList.add('dark'); }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/redesign.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased flex h-screen overflow-hidden">

    <aside id="app-sidebar"></aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#F8FAFC] dark:bg-gray-900">
        <header class="header-premium px-8 py-5">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white">Novo Lançamento — Retrabalho / Refugo</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Os campos seguem exatamente as colunas da planilha modelo de retrabalho e refugo.</p>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-7xl mx-auto grid grid-cols-1 xl:grid-cols-3 gap-6">
                <form id="m2-form" class="xl:col-span-2 chart-card space-y-5">
                    <div id="m2-form-fields" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2 border-t border-gray-200 dark:border-gray-700">
                        <div class="flex gap-8">
                            <div>
                                <p class="text-xs uppercase tracking-wide text-gray-500">Total Retrabalho</p>
                                <p class="text-2xl font-bold text-brand-600" id="m2-total-rework">0</p>
                            </div>
                            <div>
                                <p class="text-xs uppercase tracking-wide text-gray-500">Total Refugo</p>
                                <p class="text-2xl font-bold text-red-500" id="m2-total-scrap">0</p>
                            </div>
                        </div>
                        <button type="submit" id="m2-submit-btn" class="btn-premium btn-brand flex items-center gap-2">
                            <i class="ph ph-floppy-disk text-lg"></i> Salvar Lançamento
                        </button>
                    </div>
                </form>

                <div class="chart-card">
                    <h3 class="chart-title text-gray-900 dark:text-white"><i class="ph ph-clock-counter-clockwise"></i> Últimos Lançamentos</h3>
                    <div class="space-y-2" id="m2-recent-list"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>requireAuth();</script>
    <script src="js/theme.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/data/api-m2.js"></script>
    <script src="js/m2/lancamentos.js"></script>
    <script src="js/components/presentation.js"></script>
</body>
</html>
