<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros de Retrabalho - QualiControl</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#1e4fe0', 600: '#2c63f5', 800: '#12328f', 900: '#0b0b0f' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <script>
        if (localStorage.getItem('qc-theme') !== 'light') { document.documentElement.classList.add('dark'); }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/redesign.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased flex h-screen overflow-hidden">

    <aside id="app-sidebar"></aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#F8FAFC] dark:bg-gray-900">
        <header class="header-premium px-8 py-5">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white">Cadastros — Retrabalho e Refugo</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Listas exclusivas do Módulo 2, independentes dos cadastros de Não Conformidades.</p>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

                <div class="chart-card flex flex-col max-h-[420px]">
                    <h3 class="chart-title text-gray-900 dark:text-white"><i class="ph ph-gear-six"></i> Máquinas</h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="m2-input-machines" class="input-premium flex-1 text-sm" placeholder="Nova máquina">
                        <button class="btn-premium btn-brand" data-add="m2_machines"><i class="ph ph-plus"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-2" id="m2-list-machines"></div>
                </div>

                <div class="chart-card flex flex-col max-h-[420px]">
                    <h3 class="chart-title text-gray-900 dark:text-white"><i class="ph ph-clock"></i> Turnos</h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="m2-input-shifts" class="input-premium flex-1 text-sm" placeholder="Novo turno">
                        <button class="btn-premium btn-brand" data-add="m2_shifts"><i class="ph ph-plus"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-2" id="m2-list-shifts"></div>
                </div>

                <div class="chart-card flex flex-col max-h-[420px]">
                    <h3 class="chart-title text-gray-900 dark:text-white"><i class="ph ph-warning-circle"></i> Motivos</h3><p class="chart-caption">Distribuição das quantidades por motivo.</p>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="m2-input-reasons" class="input-premium flex-1 text-sm" placeholder="Novo motivo">
                        <button class="btn-premium btn-brand" data-add="m2_reasons"><i class="ph ph-plus"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-2" id="m2-list-reasons"></div>
                </div>

                <div class="chart-card flex flex-col max-h-[420px]">
                    <h3 class="chart-title text-gray-900 dark:text-white"><i class="ph ph-package"></i> Produtos</h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="m2-input-products" class="input-premium flex-1 text-sm" placeholder="Novo produto">
                        <button class="btn-premium btn-brand" data-add="m2_products"><i class="ph ph-plus"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-2" id="m2-list-products"></div>
                </div>

                <div class="chart-card flex flex-col max-h-[420px]">
                    <h3 class="chart-title text-gray-900 dark:text-white"><i class="ph ph-user-circle"></i> Responsáveis</h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="m2-input-responsibles" class="input-premium flex-1 text-sm" placeholder="Novo responsável">
                        <button class="btn-premium btn-brand" data-add="m2_responsibles"><i class="ph ph-plus"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-2" id="m2-list-responsibles"></div>
                </div>

            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>requireAuth();</script>
    <script src="js/theme.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/data/api-m2.js"></script>
    <script src="js/m2/cadastros.js"></script>
    <script src="js/components/presentation.js"></script>
</body>
</html>
